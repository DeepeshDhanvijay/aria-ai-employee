services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aria
      POSTGRES_USER: aria
      POSTGRES_PASSWORD: aria_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:///./data/aria.db
      REDIS_URL: redis://redis:6379/0
      CRM_MCP_URL: http://crm:8001
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      - redis
      - crm

  crm:
    build: ./mcp-crm
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
